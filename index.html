<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1f2937" />
    <title>PDF Reader — Highlight to Translate</title>
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="/src/style.css" />
    <script src="gemma.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-left">
        <button id="historyBtn" class="icon-btn" title="History" aria-label="History">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 12a9 9 0 1 0 3-6.7" />
            <polyline points="3 4 3 9 8 9" />
            <polyline points="12 7 12 12 15 14" />
          </svg>
        </button>
        <button id="uploadBtn" class="icon-btn" title="Open PDF" aria-label="Open PDF">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 16V4" />
            <polyline points="7 9 12 4 17 9" />
            <path d="M5 16v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3" />
          </svg>
        </button>
        <h1 class="title">PDF Reader</h1>
      </div>
      <div class="topbar-actions">
        <label class="mode-select" title="Translation mode">
          <span class="mode-label">Mode</span>
          <select id="modeSelect" aria-label="Translation mode"></select>
        </label>
        <button id="installBtn" class="install-btn" type="button" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 4v12" />
            <polyline points="7 11 12 16 17 11" />
            <path d="M5 20h14" />
          </svg>
          <span class="install-label">Install</span>
        </button>
        <label class="lang-select">
          <span class="lang-label">Translate to</span>
          <select id="targetLang" aria-label="Target language"></select>
        </label>
      </div>
    </header>

    <div id="offlineBanner" class="offline-banner" role="status" aria-live="polite">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 3l18 18" />
        <path d="M9.5 16.5a5 5 0 0 1 5 0" />
        <path d="M5 12a10 10 0 0 1 4-2.5" />
        <path d="M19 12a10 10 0 0 0-4-2.5" />
      </svg>
      <span>You're offline — cached PDFs and translations still work.</span>
    </div>

    <aside id="translationPanel" class="translation-panel" aria-label="Translation panel">
      <div class="panel-handle" id="panelHandle" aria-hidden="true"><span></span></div>
      <div class="panel-header">
        <span class="panel-title">Auto-translate</span>
        <button id="panelClearBtn" class="panel-action-btn" type="button" title="Clear">Clear</button>
      </div>
      <div class="panel-list"></div>
      <div class="panel-empty">
        <p>Scroll the PDF to translate paragraphs as you read.</p>
      </div>
    </aside>

    <section id="readerView" class="reader-view" hidden aria-label="Reader view">
      <div id="readerToolbar" class="reader-toolbar">
        <button class="reader-play-all" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polygon points="6 4 20 12 6 20 6 4" fill="currentColor" />
          </svg>
          <span class="label">Read All</span>
        </button>
        <button class="reader-stop" type="button" aria-label="Stop">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor" />
          </svg>
        </button>
        <label class="reader-rate-wrap">
          <span class="reader-rate-label">Speed</span>
          <input class="reader-rate" type="range" min="0.5" max="2" step="0.05" />
          <span class="reader-rate-value">1.00x</span>
        </label>
        <label class="reader-toggle-wrap">
          <input class="reader-toggle-original" type="checkbox" checked />
          <span>Show original</span>
        </label>
      </div>
      <div class="reader-list"></div>
    </section>

    <main id="viewer" class="viewer" aria-label="PDF viewer">
      <div class="skeleton-page" aria-hidden="true">
        <div class="skeleton-line" style="width: 60%"></div>
        <div class="skeleton-line" style="width: 90%"></div>
        <div class="skeleton-line" style="width: 85%"></div>
        <div class="skeleton-line" style="width: 75%"></div>
        <div class="skeleton-line" style="width: 92%"></div>
        <div class="skeleton-line" style="width: 80%"></div>
        <div class="skeleton-line" style="width: 70%"></div>
      </div>
    </main>

    <input type="file" id="fileInput" accept="application/pdf,.pdf" hidden />

    <div id="dropZone" class="drop-zone" aria-hidden="true">
      <div class="drop-zone-msg">📥 Drop PDF to open</div>
    </div>

    <aside id="historyDrawer" class="drawer" hidden>
      <div class="drawer-panel">
        <div class="drawer-header">
          <h2>Library</h2>
          <button id="historyClose" class="icon-btn" aria-label="Close">×</button>
        </div>
        <div class="drawer-tabs" role="tablist">
          <button class="drawer-tab drawer-tab-active" data-tab="library" type="button" role="tab">My Library</button>
          <button class="drawer-tab" data-tab="discover" type="button" role="tab">Discover</button>
        </div>
        <div class="drawer-list" data-tab-pane="library"></div>
        <div class="drawer-gallery" data-tab-pane="discover" hidden>
          <div class="gallery-loading">Loading curated papers…</div>
        </div>
      </div>
    </aside>

    <div id="tooltip" class="tooltip" role="status" aria-live="polite" hidden>
      <div class="tooltip-handle" id="tooltipHandle" aria-hidden="true"><span></span></div>
      <button class="tooltip-close" id="tooltipClose" aria-label="Close">×</button>
      <div class="tooltip-body">
        <div class="tooltip-row">
          <div class="tooltip-source" id="tooltipSource"></div>
          <button class="tts-btn tts-btn-sm" id="tooltipSpeakSrc" type="button" title="Read original aloud">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M11 5l-6 4H3v6h2l6 4z" fill="currentColor" />
              <path d="M15 9c1.5 1 1.5 5 0 6" />
              <path d="M18 6c3 2 3 10 0 12" />
            </svg>
          </button>
        </div>
        <div class="tooltip-arrow">→</div>
        <div class="tooltip-row">
          <div class="tooltip-target" id="tooltipTarget"></div>
          <button class="tts-btn tts-btn-sm" id="tooltipSpeakTgt" type="button" title="Read translation aloud">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M11 5l-6 4H3v6h2l6 4z" fill="currentColor" />
              <path d="M15 9c1.5 1 1.5 5 0 6" />
              <path d="M18 6c3 2 3 10 0 12" />
            </svg>
          </button>
        </div>
        <button class="explain-btn" id="tooltipExplain" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 4h12a3 3 0 0 1 3 3v13H7a3 3 0 0 1-3-3z" />
            <path d="M4 17a3 3 0 0 1 3-3h12" />
          </svg>
          Explain
        </button>
        <div class="explain-body" id="tooltipExplainBody" hidden></div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
