<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#1f2937" />
    <title>PDF Reader — Highlight to Translate</title>
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="/src/style.css" />
    <script src="gemma.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-left">
        <button id="historyBtn" class="icon-btn" title="History" aria-label="History">📂</button>
        <button id="uploadBtn" class="icon-btn" title="Open PDF" aria-label="Open PDF">📤</button>
        <h1 class="title">PDF Reader</h1>
      </div>
      <div class="topbar-actions">
        <label class="lang-select">
          <span class="lang-label">Translate to</span>
          <select id="targetLang" aria-label="Target language"></select>
        </label>
      </div>
    </header>

    <main id="viewer" class="viewer" aria-label="PDF viewer"></main>

    <input type="file" id="fileInput" accept="application/pdf,.pdf" hidden />

    <div id="dropZone" class="drop-zone" aria-hidden="true">
      <div class="drop-zone-msg">📥 Drop PDF to open</div>
    </div>

    <aside id="historyDrawer" class="drawer" hidden>
      <div class="drawer-panel">
        <div class="drawer-header">
          <h2>History</h2>
          <button id="historyClose" class="icon-btn" aria-label="Close">×</button>
        </div>
        <div class="drawer-list"></div>
      </div>
    </aside>

    <div id="tooltip" class="tooltip" role="status" aria-live="polite" hidden>
      <div class="tooltip-source" id="tooltipSource"></div>
      <div class="tooltip-arrow">→</div>
      <div class="tooltip-target" id="tooltipTarget"></div>
      <button class="explain-btn" id="tooltipExplain" hidden>📖 Explain</button>
      <div class="explain-body" id="tooltipExplainBody" hidden></div>
      <button class="tooltip-close" id="tooltipClose" aria-label="Close">×</button>
    </div>

    <div id="status" class="status" aria-live="polite"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
