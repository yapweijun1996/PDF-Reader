<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1f2937" />
    <title>PDF Reader — Highlight to Translate</title>
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="/src/style.css" />
    <script src="gemma.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-left">
        <button id="historyBtn" class="icon-btn" title="History" aria-label="History">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 12a9 9 0 1 0 3-6.7" />
            <polyline points="3 4 3 9 8 9" />
            <polyline points="12 7 12 12 15 14" />
          </svg>
        </button>
        <button id="uploadBtn" class="icon-btn" title="Open PDF" aria-label="Open PDF">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 16V4" />
            <polyline points="7 9 12 4 17 9" />
            <path d="M5 16v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3" />
          </svg>
        </button>
        <h1 class="title">PDF Reader</h1>
      </div>
      <div class="topbar-actions">
        <button id="autoModeBtn" class="icon-btn mode-btn" type="button" title="Toggle auto-translate" aria-label="Toggle auto-translate" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 8h6" />
            <path d="M8 5v3" />
            <path d="M5 14l3-6 3 6" />
            <path d="M5.7 12h4.6" />
            <path d="M14 19l3-6 3 6" />
            <path d="M14.7 17h4.6" />
            <path d="M13 5l8 0" />
            <path d="M17 5v3" />
          </svg>
        </button>
        <button id="installBtn" class="install-btn" type="button" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 4v12" />
            <polyline points="7 11 12 16 17 11" />
            <path d="M5 20h14" />
          </svg>
          <span class="install-label">Install</span>
        </button>
        <label class="lang-select">
          <span class="lang-label">Translate to</span>
          <select id="targetLang" aria-label="Target language"></select>
        </label>
      </div>
    </header>

    <div id="offlineBanner" class="offline-banner" role="status" aria-live="polite">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 3l18 18" />
        <path d="M9.5 16.5a5 5 0 0 1 5 0" />
        <path d="M5 12a10 10 0 0 1 4-2.5" />
        <path d="M19 12a10 10 0 0 0-4-2.5" />
      </svg>
      <span>You're offline — cached PDFs and translations still work.</span>
    </div>

    <aside id="translationPanel" class="translation-panel" aria-label="Translation panel">
      <div class="panel-header">
        <span class="panel-title">Auto-translate</span>
        <button id="panelClearBtn" class="panel-action-btn" type="button" title="Clear">Clear</button>
      </div>
      <div class="panel-list"></div>
      <div class="panel-empty">
        <p>Scroll the PDF to translate paragraphs as you read.</p>
      </div>
    </aside>

    <main id="viewer" class="viewer" aria-label="PDF viewer">
      <div class="skeleton-page" aria-hidden="true">
        <div class="skeleton-line" style="width: 60%"></div>
        <div class="skeleton-line" style="width: 90%"></div>
        <div class="skeleton-line" style="width: 85%"></div>
        <div class="skeleton-line" style="width: 75%"></div>
        <div class="skeleton-line" style="width: 92%"></div>
        <div class="skeleton-line" style="width: 80%"></div>
        <div class="skeleton-line" style="width: 70%"></div>
      </div>
    </main>

    <input type="file" id="fileInput" accept="application/pdf,.pdf" hidden />

    <div id="dropZone" class="drop-zone" aria-hidden="true">
      <div class="drop-zone-msg">📥 Drop PDF to open</div>
    </div>

    <aside id="historyDrawer" class="drawer" hidden>
      <div class="drawer-panel">
        <div class="drawer-header">
          <h2>History</h2>
          <button id="historyClose" class="icon-btn" aria-label="Close">×</button>
        </div>
        <div class="drawer-list"></div>
      </div>
    </aside>

    <div id="tooltip" class="tooltip" role="status" aria-live="polite" hidden>
      <div class="tooltip-handle" id="tooltipHandle" aria-hidden="true"><span></span></div>
      <button class="tooltip-close" id="tooltipClose" aria-label="Close">×</button>
      <div class="tooltip-body">
        <div class="tooltip-source" id="tooltipSource"></div>
        <div class="tooltip-arrow">→</div>
        <div class="tooltip-target" id="tooltipTarget"></div>
        <button class="explain-btn" id="tooltipExplain" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 4h12a3 3 0 0 1 3 3v13H7a3 3 0 0 1-3-3z" />
            <path d="M4 17a3 3 0 0 1 3-3h12" />
          </svg>
          Explain
        </button>
        <div class="explain-body" id="tooltipExplainBody" hidden></div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
