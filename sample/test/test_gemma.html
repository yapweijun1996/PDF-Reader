<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gemma.js 功能测试</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0d1117; color: #c9d1d9;
            padding: 24px; line-height: 1.6;
        }
        h1 { color: #58a6ff; margin-bottom: 8px; }
        .subtitle { color: #8b949e; margin-bottom: 24px; }
        .test-group {
            background: #161b22; border: 1px solid #30363d;
            border-radius: 8px; margin-bottom: 16px; overflow: hidden;
        }
        .test-group-title {
            background: #21262d; padding: 12px 16px;
            font-weight: 600; color: #f0f6fc; font-size: 14px;
            border-bottom: 1px solid #30363d;
        }
        .test-item {
            padding: 10px 16px; border-bottom: 1px solid #21262d;
            display: flex; align-items: center; gap: 12px; font-size: 13px;
        }
        .test-item:last-child { border-bottom: none; }
        .badge {
            display: inline-block; padding: 2px 8px; border-radius: 12px;
            font-size: 11px; font-weight: 600; min-width: 48px; text-align: center;
        }
        .pass { background: #23863620; color: #3fb950; border: 1px solid #23863640; }
        .fail { background: #f8514920; color: #f85149; border: 1px solid #f8514940; }
        .skip { background: #d29922; color: #0d1117; }
        .test-name { flex: 1; }
        .test-detail { color: #8b949e; font-size: 12px; font-family: monospace; }
        .summary {
            background: #161b22; border: 1px solid #30363d;
            border-radius: 8px; padding: 16px; margin-bottom: 24px;
            display: flex; gap: 24px;
        }
        .summary-item { text-align: center; }
        .summary-num { font-size: 28px; font-weight: 700; }
        .summary-label { font-size: 12px; color: #8b949e; }
        .green { color: #3fb950; }
        .red { color: #f85149; }
        .yellow { color: #d29922; }
        .blue { color: #58a6ff; }
        #log {
            background: #0d1117; border: 1px solid #30363d; border-radius: 8px;
            padding: 16px; font-family: monospace; font-size: 12px;
            max-height: 300px; overflow-y: auto; white-space: pre-wrap;
            margin-top: 16px; color: #8b949e;
        }
    </style>
</head>
<body>
    <h1>gemma.js 功能测试</h1>
    <p class="subtitle">测试加密/解密、密钥轮换、重试逻辑等核心功能</p>

    <div class="summary" id="summary">
        <div class="summary-item"><div class="summary-num blue" id="totalNum">0</div><div class="summary-label">总测试数</div></div>
        <div class="summary-item"><div class="summary-num green" id="passNum">0</div><div class="summary-label">通过</div></div>
        <div class="summary-item"><div class="summary-num red" id="failNum">0</div><div class="summary-label">失败</div></div>
        <div class="summary-item"><div class="summary-num yellow" id="skipNum">0</div><div class="summary-label">跳过</div></div>
    </div>

    <div id="results"></div>
    <div id="log"></div>

    <!-- 加载 gemma.js（路径指向上级目录） -->
    <script src="../gemma.js"></script>
    <script>
    // ===== 简易测试框架 =====
    const results = [];
    let totalTests = 0, passed = 0, failed = 0, skipped = 0;

    function log(msg) {
        document.getElementById('log').textContent += msg + '\n';
    }

    function assert(condition, testName, detail = '') {
        totalTests++;
        if (condition) {
            passed++;
            results.push({ name: testName, status: 'pass', detail });
            log(`[PASS] ${testName}`);
        } else {
            failed++;
            results.push({ name: testName, status: 'fail', detail });
            log(`[FAIL] ${testName} — ${detail}`);
        }
    }

    function assertEq(actual, expected, testName) {
        const pass = actual === expected;
        assert(pass, testName, pass ? `${actual}` : `期望: ${expected}, 实际: ${actual}`);
    }

    function assertThrows(fn, testName) {
        totalTests++;
        try {
            fn();
            failed++;
            results.push({ name: testName, status: 'fail', detail: '应该抛出异常但没有' });
            log(`[FAIL] ${testName} — 应该抛出异常但没有`);
        } catch (e) {
            passed++;
            results.push({ name: testName, status: 'pass', detail: `抛出: ${e.message}` });
            log(`[PASS] ${testName} — 抛出: ${e.message}`);
        }
    }

    function skipTest(testName, reason) {
        totalTests++; skipped++;
        results.push({ name: testName, status: 'skip', detail: reason });
        log(`[SKIP] ${testName} — ${reason}`);
    }

    function renderResults(groups) {
        const container = document.getElementById('results');
        for (const group of groups) {
            const div = document.createElement('div');
            div.className = 'test-group';
            let html = `<div class="test-group-title">${group.title}</div>`;
            for (const r of results.filter(r => group.tests.includes(r.name))) {
                html += `<div class="test-item">
                    <span class="badge ${r.status}">${r.status === 'pass' ? '通过' : r.status === 'fail' ? '失败' : '跳过'}</span>
                    <span class="test-name">${r.name}</span>
                    <span class="test-detail">${r.detail}</span>
                </div>`;
            }
            div.innerHTML = html;
            container.appendChild(div);
        }
        document.getElementById('totalNum').textContent = totalTests;
        document.getElementById('passNum').textContent = passed;
        document.getElementById('failNum').textContent = failed;
        document.getElementById('skipNum').textContent = skipped;
    }

    // ===== 测试用例 =====

    function testEncryptDecrypt() {
        // 测试1: 基本加密解密往返
        const original = "AIzaSyTestKey12345";
        const encrypted = encryptKey(original, XOR_SEED);
        const decrypted = decryptKey(encrypted, XOR_SEED);
        assertEq(decrypted, original, "加密解密往返 - 基本字符串");

        // 测试2: 空字符串
        const encEmpty = encryptKey("", XOR_SEED);
        const decEmpty = decryptKey(encEmpty, XOR_SEED);
        assertEq(decEmpty, "", "加密解密往返 - 空字符串");

        // 测试3: 长字符串（超过密钥长度）
        const longStr = "A".repeat(100);
        const encLong = encryptKey(longStr, XOR_SEED);
        const decLong = decryptKey(encLong, XOR_SEED);
        assertEq(decLong, longStr, "加密解密往返 - 长字符串(100字符)");

        // 测试4: 特殊字符
        const special = "!@#$%^&*()-_=+[]{}|;':\",./<>?";
        const encSpecial = encryptKey(special, XOR_SEED);
        const decSpecial = decryptKey(encSpecial, XOR_SEED);
        assertEq(decSpecial, special, "加密解密往返 - 特殊字符");

        // 测试5: 加密结果长度 = 原文字节数 * 3
        const testStr = "Hello";
        const enc = encryptKey(testStr, XOR_SEED);
        assertEq(enc.length, new TextEncoder().encode(testStr).length * 3, "加密输出长度 = 字节数 × 3");

        // 测试6: 加密结果全是数字
        assert(/^\d+$/.test(enc), "加密输出仅包含数字字符");

        // 测试7: 不同密钥加密结果不同
        const enc1 = encryptKey("test", "key1");
        const enc2 = encryptKey("test", "key2");
        assert(enc1 !== enc2, "不同密钥产生不同密文");

        // 测试8: 相同输入产生相同输出（确定性）
        const encA = encryptKey("deterministic", XOR_SEED);
        const encB = encryptKey("deterministic", XOR_SEED);
        assertEq(encA, encB, "相同输入+相同密钥 = 相同密文（确定性）");

        // 测试9: 用错误密钥解密得到错误结果
        const encRight = encryptKey("secret", "correctkey");
        const decWrong = decryptKey(encRight, "wrongkey");
        assert(decWrong !== "secret", "错误密钥解密得到错误结果");
    }

    function testKeyRotation() {
        // 保存原始状态
        const origKeys = [...apiKeys];
        const origIndex = currentKeyIndex;
        const origCount = keyUseCount;

        // 设置测试环境
        apiKeys = ["key_A", "key_B", "key_C"];
        currentKeyIndex = 0;
        keyUseCount = 0;
        ROTATE_EVERY_N = 3;

        // 测试1: 初始密钥是第一个
        assertEq(getCurrentKey(), "key_A", "初始返回第一个密钥");

        // 测试2: 连续使用同一个密钥
        assertEq(getCurrentKey(), "key_A", "第2次使用仍是第一个密钥");

        // 测试3: 到达 N 次后自动轮换
        const key3 = getCurrentKey(); // keyUseCount 变为 3，触发轮换
        assertEq(key3, "key_B", "第3次使用触发主动轮换到 key_B");

        // 测试4: 手动轮换
        rotateKey();
        assertEq(apiKeys[currentKeyIndex], "key_C", "手动轮换到 key_C");

        // 测试5: 循环回到开头
        rotateKey();
        assertEq(apiKeys[currentKeyIndex], "key_A", "循环回到 key_A");

        // 测试6: 只有一个密钥时不轮换
        apiKeys = ["only_key"];
        currentKeyIndex = 0;
        keyUseCount = 0;
        getCurrentKey(); getCurrentKey(); getCurrentKey();
        assertEq(apiKeys[currentKeyIndex], "only_key", "单密钥不触发轮换");

        // 测试7: 空密钥数组抛出异常
        apiKeys = [];
        assertThrows(() => getCurrentKey(), "空密钥数组调用 getCurrentKey() 抛出异常");

        // 测试8: 空数组 rotateKey 不崩溃
        try {
            rotateKey(); // 不应崩溃
            assert(true, "空数组 rotateKey() 不会崩溃");
        } catch {
            assert(false, "空数组 rotateKey() 不会崩溃");
        }

        // 恢复原始状态
        apiKeys = origKeys;
        currentKeyIndex = origIndex;
        keyUseCount = origCount;
        ROTATE_EVERY_N = 5;
    }

    function testSleep() {
        // 测试 sleep 返回 Promise
        const result = sleep(0);
        assert(result instanceof Promise, "sleep() 返回 Promise 对象");

        // 测试 sleep 实际延迟
        const start = performance.now();
        sleep(50).then(() => {
            const elapsed = performance.now() - start;
            // 允许一定的误差
            log(`[INFO] sleep(50) 实际延迟: ${elapsed.toFixed(1)}ms`);
        });
    }

    function testFetchWithRetryMock() {
        // 测试 fetchWithRetry 函数存在且可调用
        assert(typeof fetchWithRetry === 'function', "fetchWithRetry 是一个函数");
        assert(fetchWithRetry.length === 2, "fetchWithRetry 接受 2 个参数 (url, options)");
    }

    function testCallGeminiAPI() {
        // 测试函数签名
        assert(typeof callGeminiAPI === 'function', "callGeminiAPI 是一个函数");
        assert(callGeminiAPI.length === 4, "callGeminiAPI 接受 4 个参数");

        // 测试 chatHistory 的修改行为
        const origKeys2 = [...apiKeys];
        apiKeys = []; // 确保没有 key，让它快速失败

        const history = [];
        const msg = { role: "user", parts: [{ text: "test" }] };

        // 所有密钥失败后，chatHistory 应被还原（pop）
        callGeminiAPI("test-model", msg, history, {}).catch(err => {
            // 预期失败
            log(`[INFO] callGeminiAPI 空密钥正确抛出: ${err.message}`);
        });

        apiKeys = origKeys2;
    }

    function testConfigDefaults() {
        // 测试默认配置值
        assert(typeof XOR_SEED === 'string', "XOR_SEED 是字符串类型");
        assert(XOR_SEED.length > 0, "XOR_SEED 不为空");
        assertEq(RATE_LIMIT_MAX_RETRIES, 5, "RATE_LIMIT_MAX_RETRIES 默认值为 5");
        assertEq(RATE_LIMIT_BASE_DELAY, 1000, "RATE_LIMIT_BASE_DELAY 默认值为 1000ms");
        assertEq(typeof ROTATE_EVERY_N, 'number', "ROTATE_EVERY_N 是数字类型");
    }

    function testGlobalExports() {
        // 确认所有公开函数和变量都可用
        assert(typeof encryptKey === 'function', "encryptKey 全局可用");
        assert(typeof decryptKey === 'function', "decryptKey 全局可用");
        assert(typeof loadApiKeys === 'function', "loadApiKeys 全局可用");
        assert(typeof getCurrentKey === 'function', "getCurrentKey 全局可用");
        assert(typeof rotateKey === 'function', "rotateKey 全局可用");
        assert(typeof fetchWithRetry === 'function', "fetchWithRetry 全局可用");
        assert(typeof callGeminiAPI === 'function', "callGeminiAPI 全局可用");
        assert(typeof sleep === 'function', "sleep 全局可用");
    }

    function testXORProperties() {
        // XOR 的数学特性: a ^ b ^ b = a
        const msg = "TestXOR";
        const key = "mykey";
        const encoded = new TextEncoder().encode(msg);
        const keyBytes = new TextEncoder().encode(key);

        let allMatch = true;
        for (let i = 0; i < encoded.length; i++) {
            const k = keyBytes[i % keyBytes.length];
            const xored = encoded[i] ^ k ^ k;
            if (xored !== encoded[i]) { allMatch = false; break; }
        }
        assert(allMatch, "XOR 双重运算还原性: a ^ k ^ k = a");

        // XOR 交换律
        const a = 0x5A, b = 0x3C;
        assertEq(a ^ b, b ^ a, "XOR 交换律: a ^ b === b ^ a");

        // XOR 自反性
        assertEq(a ^ a, 0, "XOR 自反性: a ^ a === 0");
    }

    function testEdgeCases() {
        // 单字符
        const single = "X";
        assertEq(decryptKey(encryptKey(single, XOR_SEED), XOR_SEED), single, "单字符加密解密");

        // 数字字符串
        const nums = "0123456789";
        assertEq(decryptKey(encryptKey(nums, XOR_SEED), XOR_SEED), nums, "纯数字字符串加密解密");

        // 密钥比明文长
        const shortMsg = "Hi";
        const longKey = "ThisIsAVeryLongKeyThatExceedsTheMessageLength";
        assertEq(decryptKey(encryptKey(shortMsg, longKey), longKey), shortMsg, "密钥比明文长时正常工作");

        // 密钥为单字符
        const singleKey = "K";
        assertEq(decryptKey(encryptKey("Hello", singleKey), singleKey), "Hello", "单字符密钥正常工作");
    }

    // ===== 运行所有测试 =====

    const testGroups = [
        {
            title: '1. 加密 / 解密 (encryptKey & decryptKey)',
            fn: testEncryptDecrypt,
            tests: [
                "加密解密往返 - 基本字符串", "加密解密往返 - 空字符串",
                "加密解密往返 - 长字符串(100字符)", "加密解密往返 - 特殊字符",
                "加密输出长度 = 字节数 × 3", "加密输出仅包含数字字符",
                "不同密钥产生不同密文", "相同输入+相同密钥 = 相同密文（确定性）",
                "错误密钥解密得到错误结果"
            ]
        },
        {
            title: '2. 密钥轮换 (getCurrentKey & rotateKey)',
            fn: testKeyRotation,
            tests: [
                "初始返回第一个密钥", "第2次使用仍是第一个密钥",
                "第3次使用触发主动轮换到 key_B", "手动轮换到 key_C",
                "循环回到 key_A", "单密钥不触发轮换",
                "空密钥数组调用 getCurrentKey() 抛出异常", "空数组 rotateKey() 不会崩溃"
            ]
        },
        {
            title: '3. 工具函数 (sleep & fetchWithRetry)',
            fn: () => { testSleep(); testFetchWithRetryMock(); },
            tests: [
                "sleep() 返回 Promise 对象",
                "fetchWithRetry 是一个函数", "fetchWithRetry 接受 2 个参数 (url, options)"
            ]
        },
        {
            title: '4. API 调用 (callGeminiAPI)',
            fn: testCallGeminiAPI,
            tests: [
                "callGeminiAPI 是一个函数", "callGeminiAPI 接受 4 个参数"
            ]
        },
        {
            title: '5. 配置与全局导出',
            fn: () => { testConfigDefaults(); testGlobalExports(); },
            tests: [
                "XOR_SEED 是字符串类型", "XOR_SEED 不为空",
                "RATE_LIMIT_MAX_RETRIES 默认值为 5", "RATE_LIMIT_BASE_DELAY 默认值为 1000ms",
                "ROTATE_EVERY_N 是数字类型",
                "encryptKey 全局可用", "decryptKey 全局可用", "loadApiKeys 全局可用",
                "getCurrentKey 全局可用", "rotateKey 全局可用", "fetchWithRetry 全局可用",
                "callGeminiAPI 全局可用", "sleep 全局可用"
            ]
        },
        {
            title: '6. XOR 数学特性',
            fn: testXORProperties,
            tests: [
                "XOR 双重运算还原性: a ^ k ^ k = a",
                "XOR 交换律: a ^ b === b ^ a",
                "XOR 自反性: a ^ a === 0"
            ]
        },
        {
            title: '7. 边界情况',
            fn: testEdgeCases,
            tests: [
                "单字符加密解密", "纯数字字符串加密解密",
                "密钥比明文长时正常工作", "单字符密钥正常工作"
            ]
        }
    ];

    log('===== gemma.js 功能测试开始 =====\n');
    for (const g of testGroups) {
        log(`--- ${g.title} ---`);
        g.fn();
        log('');
    }
    log('===== 测试完成 =====');
    renderResults(testGroups);
    </script>
</body>
</html>
