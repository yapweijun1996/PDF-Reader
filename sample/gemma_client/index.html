<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GemmaClient — Test Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0c; --surface: #141418; --surface2: #1c1c22; --surface3: #24242c;
            --border: rgba(255,255,255,0.06); --border2: rgba(255,255,255,0.12);
            --text: #e8e8ed; --text2: #8e8e9a; --text3: #5c5c6a;
            --blue: #4a9eff; --green: #34d399; --red: #f87171; --amber: #fbbf24;
            --purple: #a78bfa; --cyan: #22d3ee; --pink: #f472b6;
            --radius: 12px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

        /* Header */
        .header { border-bottom: 1px solid var(--border); padding: 20px 32px; display: flex; align-items: center; gap: 16px; }
        .header .logo { width: 40px; height: 40px; border-radius: 10px; background: linear-gradient(135deg, var(--purple), var(--blue)); display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 800; }
        .header h1 { font-size: 18px; font-weight: 700; }
        .header .ver { font-size: 12px; color: var(--text3); background: var(--surface2); padding: 3px 10px; border-radius: 20px; }
        .header .spacer { flex: 1; }
        .header .link { color: var(--text2); text-decoration: none; font-size: 13px; padding: 6px 14px; border-radius: 8px; transition: all 0.2s; }
        .header .link:hover { color: var(--text); background: var(--surface2); }

        .container { max-width: 1200px; margin: 0 auto; padding: 32px; }

        /* Stats bar */
        .stats-bar { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; margin-bottom: 32px; }
        .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
        .stat-card .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text3); margin-bottom: 8px; }
        .stat-card .value { font-size: 28px; font-weight: 800; }
        .stat-card .value.blue { color: var(--blue); }
        .stat-card .value.green { color: var(--green); }
        .stat-card .value.red { color: var(--red); }
        .stat-card .value.amber { color: var(--amber); }
        .stat-card .value.purple { color: var(--purple); }

        /* Run bar */
        .run-bar { display: flex; gap: 12px; margin-bottom: 24px; align-items: center; }
        .run-bar button { padding: 10px 24px; border-radius: 8px; border: none; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.15s; font-family: inherit; }
        .btn-run { background: var(--green); color: #000; }
        .btn-run:hover { filter: brightness(1.1); }
        .btn-run:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-reset { background: var(--surface2); color: var(--text); border: 1px solid var(--border2) !important; }
        .btn-reset:hover { background: var(--surface3); }
        .run-bar .progress-text { font-size: 13px; color: var(--text2); margin-left: auto; }
        .progress-wrap { flex: 1; max-width: 300px; height: 6px; background: var(--surface2); border-radius: 3px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--green); border-radius: 3px; transition: width 0.2s; width: 0%; }

        /* Filter tabs */
        .filter-tabs { display: flex; gap: 4px; margin-bottom: 16px; }
        .filter-tab { padding: 6px 16px; border-radius: 20px; font-size: 12px; font-weight: 500; cursor: pointer; border: 1px solid transparent; background: var(--surface); color: var(--text2); transition: all 0.15s; }
        .filter-tab:hover { color: var(--text); border-color: var(--border2); }
        .filter-tab.active { background: var(--blue); color: #fff; }
        .filter-tab .count { margin-left: 4px; opacity: 0.7; }

        /* Test groups */
        .test-group { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 12px; overflow: hidden; }
        .group-header { padding: 14px 20px; display: flex; align-items: center; gap: 12px; cursor: pointer; user-select: none; border-bottom: 1px solid var(--border); }
        .group-header:hover { background: var(--surface2); }
        .group-header .arrow { font-size: 10px; color: var(--text3); transition: transform 0.2s; }
        .group-header .arrow.open { transform: rotate(90deg); }
        .group-header .title { font-size: 14px; font-weight: 600; flex: 1; }
        .group-header .group-stats { display: flex; gap: 8px; }
        .group-header .mini-badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 600; }
        .mini-badge.pass-bg { background: rgba(52,211,153,0.15); color: var(--green); }
        .mini-badge.fail-bg { background: rgba(248,113,113,0.15); color: var(--red); }

        .group-body { display: none; }
        .group-body.open { display: block; }

        .test-row { padding: 10px 20px; display: flex; align-items: center; gap: 12px; font-size: 13px; border-bottom: 1px solid rgba(255,255,255,0.03); transition: background 0.1s; }
        .test-row:last-child { border-bottom: none; }
        .test-row:hover { background: rgba(255,255,255,0.02); }
        .test-row .icon { width: 20px; text-align: center; font-size: 12px; }
        .test-row .icon.pass { color: var(--green); }
        .test-row .icon.fail { color: var(--red); }
        .test-row .icon.pending { color: var(--text3); }
        .test-row .icon.running { color: var(--amber); }
        .test-row .name { flex: 1; }
        .test-row .detail { color: var(--text3); font-size: 11px; font-family: 'SF Mono', monospace; max-width: 400px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .test-row .duration { color: var(--text3); font-size: 11px; min-width: 50px; text-align: right; }

        /* Log */
        .log-section { margin-top: 24px; }
        .log-toggle { font-size: 13px; color: var(--text2); cursor: pointer; padding: 8px 0; }
        .log-toggle:hover { color: var(--text); }
        #logBox { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; font-family: 'SF Mono', 'Fira Code', monospace; font-size: 11px; max-height: 400px; overflow-y: auto; white-space: pre-wrap; color: var(--text3); display: none; margin-top: 8px; }

        @media (max-width: 768px) {
            .stats-bar { grid-template-columns: repeat(3, 1fr); }
            .container { padding: 16px; }
        }
        @media (max-width: 480px) {
            .stats-bar { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>

<div class="header">
    <div class="logo">G</div>
    <h1>GemmaClient</h1>
    <span class="ver">v1.0.0</span>
    <div class="spacer"></div>
    <a class="link" href="chat.html">&larr; Main App</a>
    <a class="link" href="https://github.com/yapweijun1996/Gemma-JSONL" target="_blank">GitHub</a>
</div>

<div class="container">

    <div class="stats-bar">
        <div class="stat-card"><div class="label">Total Tests</div><div class="value blue" id="sTotal">0</div></div>
        <div class="stat-card"><div class="label">Passed</div><div class="value green" id="sPass">0</div></div>
        <div class="stat-card"><div class="label">Failed</div><div class="value red" id="sFail">0</div></div>
        <div class="stat-card"><div class="label">Skipped</div><div class="value amber" id="sSkip">0</div></div>
        <div class="stat-card"><div class="label">Duration</div><div class="value purple" id="sDur">—</div></div>
    </div>

    <div class="run-bar">
        <button class="btn-run" id="runBtn" onclick="runAllTests()">&#9654; Run Unit Tests</button>
        <button class="btn-run" id="liveBtn" onclick="runLiveTests()" style="background:var(--amber);color:#000;">&#9889; Run Live API Tests</button>
        <button class="btn-reset" onclick="resetAll()">Reset</button>
        <div class="progress-wrap"><div class="progress-fill" id="progressBar"></div></div>
        <span class="progress-text" id="progressText"></span>
    </div>
    <div style="font-size:12px;color:var(--text3);margin-bottom:16px;">Unit tests run offline. Live API tests use real keys from <code>gemma_code.jsonl</code> and send requests to the Gemini API.</div>

    <div class="filter-tabs" id="filterTabs">
        <div class="filter-tab active" data-filter="all">All<span class="count" id="fAll"></span></div>
        <div class="filter-tab" data-filter="pass">Passed<span class="count" id="fPass"></span></div>
        <div class="filter-tab" data-filter="fail">Failed<span class="count" id="fFail"></span></div>
        <div class="filter-tab" data-filter="skip">Skipped<span class="count" id="fSkip"></span></div>
    </div>

    <div id="testResults"></div>

    <div class="log-section">
        <div class="log-toggle" onclick="toggleLog()">&#9662; Console Log</div>
        <div id="logBox"></div>
    </div>
</div>

<script src="dist/gemma_client.js"></script>
<script>
// ======================================================================
//  Test Framework
// ======================================================================
const T = {
    groups: [],        // { id, title, tests: [{ name, status, detail, duration }] }
    total: 0, passed: 0, failed: 0, skipped: 0,
    currentGroup: null,
    startTime: 0,
    filter: 'all',
};

function log(msg) {
    const el = document.getElementById('logBox');
    el.textContent += msg + '\n';
    el.scrollTop = el.scrollHeight;
}

function group(title) {
    const g = { id: T.groups.length, title, tests: [] };
    T.groups.push(g);
    T.currentGroup = g;
    log(`\n━━━ ${title} ━━━`);
}

function assert(cond, name, detail = '') {
    T.total++;
    const t0 = performance.now();
    if (cond) {
        T.passed++;
        T.currentGroup.tests.push({ name, status: 'pass', detail, duration: (performance.now() - t0).toFixed(1) });
        log(`  ✓ ${name}`);
    } else {
        T.failed++;
        T.currentGroup.tests.push({ name, status: 'fail', detail: detail || 'assertion failed', duration: (performance.now() - t0).toFixed(1) });
        log(`  ✗ ${name} — ${detail}`);
    }
}

function eq(a, b, name) {
    assert(a === b, name, a === b ? String(a) : `expected ${JSON.stringify(b)}, got ${JSON.stringify(a)}`);
}

function neq(a, b, name) {
    assert(a !== b, name, a !== b ? '' : `both are ${JSON.stringify(a)}`);
}

function deepEq(a, b, name) {
    const pass = JSON.stringify(a) === JSON.stringify(b);
    assert(pass, name, pass ? '' : `${JSON.stringify(a)} ≠ ${JSON.stringify(b)}`);
}

function throws(fn, name) {
    T.total++;
    try { fn(); T.failed++; T.currentGroup.tests.push({ name, status: 'fail', detail: 'should have thrown', duration: '0' }); }
    catch (e) { T.passed++; T.currentGroup.tests.push({ name, status: 'pass', detail: `threw: ${e.message.slice(0,60)}`, duration: '0' }); }
}

async function rejects(fn, name) {
    T.total++;
    try { await fn(); T.failed++; T.currentGroup.tests.push({ name, status: 'fail', detail: 'should have rejected', duration: '0' }); }
    catch (e) { T.passed++; T.currentGroup.tests.push({ name, status: 'pass', detail: `rejected: ${e.message.slice(0,60)}`, duration: '0' }); }
}

function skip(name, reason) {
    T.total++; T.skipped++;
    T.currentGroup.tests.push({ name, status: 'skip', detail: reason, duration: '—' });
    log(`  ○ SKIP: ${name} — ${reason}`);
}

// ======================================================================
//  Aliases
// ======================================================================
const { encryptKey, decryptKey, KeyManager, sleep, fetchWithRetry,
        GemmaAPI, ToolRegistry, ToolRunner, parseToolCalls, hasToolCalls, stripToolCalls } = GemmaClient;

// ======================================================================
//  TEST SUITES
// ======================================================================

function testEncryptDecryptBasic() {
    group('1. Encrypt / Decrypt — Basic');
    const S = '20250710';
    eq(decryptKey(encryptKey('hello', S), S), 'hello', 'Round-trip: "hello"');
    eq(decryptKey(encryptKey('', S), S), '', 'Round-trip: empty string');
    eq(decryptKey(encryptKey('a', S), S), 'a', 'Round-trip: single char');
    eq(decryptKey(encryptKey('AIzaSyB-abcdef123456', S), S), 'AIzaSyB-abcdef123456', 'Round-trip: API key format');
    eq(decryptKey(encryptKey('0123456789', S), S), '0123456789', 'Round-trip: digits only');
}

function testEncryptDecryptEdgeCases() {
    group('2. Encrypt / Decrypt — Edge Cases');
    const S = '20250710';
    const long = 'A'.repeat(500);
    eq(decryptKey(encryptKey(long, S), S), long, 'Round-trip: 500-char string');

    const special = '!@#$%^&*()_+-=[]{}|;:\'",.<>?/`~';
    eq(decryptKey(encryptKey(special, S), S), special, 'Round-trip: all special chars');

    const spaces = '  hello  world  ';
    eq(decryptKey(encryptKey(spaces, S), S), spaces, 'Round-trip: preserves whitespace');

    const newlines = 'line1\nline2\r\nline3\ttab';
    eq(decryptKey(encryptKey(newlines, S), S), newlines, 'Round-trip: newlines and tabs');

    const url = 'https://api.example.com/v1?key=abc&token=xyz#frag';
    eq(decryptKey(encryptKey(url, S), S), url, 'Round-trip: URL with query and fragment');
}

function testEncryptProperties() {
    group('3. Encrypt — Output Properties');
    const S = '20250710';
    const enc = encryptKey('Test', S);
    assert(/^\d+$/.test(enc), 'Output is digits only');
    eq(enc.length % 3, 0, 'Output length is multiple of 3');
    eq(enc.length, new TextEncoder().encode('Test').length * 3, 'Output length = bytes × 3');
    eq(encryptKey('abc', S), encryptKey('abc', S), 'Deterministic: same input → same output');
    neq(encryptKey('abcd', 'key1'), encryptKey('abcd', 'key2'), 'Different keys → different ciphertexts');
    neq(encryptKey('abc', S), encryptKey('xyz', S), 'Different inputs → different ciphertexts');
    neq(decryptKey(encryptKey('secret', 'right'), 'wrong'), 'secret', 'Wrong key → wrong result');
}

function testEncryptXORMath() {
    group('4. XOR Mathematical Properties');
    const a = 0xAB, b = 0xCD;
    eq(a ^ b, b ^ a, 'Commutativity: a^b == b^a');
    eq(a ^ a, 0, 'Self-inverse: a^a == 0');
    eq(a ^ 0, a, 'Identity: a^0 == a');
    eq((a ^ b) ^ b, a, 'Double XOR cancellation: (a^b)^b == a');
    const c = 0x55;
    eq((a ^ b) ^ c, a ^ (b ^ c), 'Associativity: (a^b)^c == a^(b^c)');
}

function testKeyManagerBasic() {
    group('5. KeyManager — Basic');
    const km = new KeyManager();
    eq(km.rotateEveryN, 1, 'Default rotateEveryN = 1');
    eq(km.seed, '20250710', 'Default seed');
    eq(km.count, 0, 'Initial count = 0');
    eq(km.index, 0, 'Initial index = 0');
    eq(km.useCount, 0, 'Initial useCount = 0');

    const km2 = new KeyManager({ rotateEveryN: 10, seed: 'custom' });
    eq(km2.rotateEveryN, 10, 'Custom rotateEveryN = 10');
    eq(km2.seed, 'custom', 'Custom seed');
}

function testKeyManagerAddAndCurrent() {
    group('6. KeyManager — addKey & current');
    const km = new KeyManager({ rotateEveryN: 5 });
    km.addKey('A'); km.addKey('B'); km.addKey('C');
    eq(km.count, 3, 'Count after adding 3 keys');
    // Rotation check: useCount > 0 && useCount % N === 0, checked BEFORE increment
    // So rotation fires at the START of call (N+1), i.e. when useCount reaches N
    eq(km.current(), 'A', '1st call: useCount=0 → no rotate → A');
    eq(km.current(), 'A', '2nd call: useCount=1 → no rotate → A');
    eq(km.current(), 'A', '3rd call: useCount=2 → no rotate → A');
    eq(km.current(), 'A', '4th call: useCount=3 → no rotate → A');
    eq(km.current(), 'A', '5th call: useCount=4 → no rotate → A');
    eq(km.current(), 'B', '6th call: useCount=5, 5%5==0 → rotate → B');
    eq(km.useCount, 6, 'useCount = 6 after 6 calls');
}

function testKeyManagerRotation() {
    group('7. KeyManager — Rotation Logic');
    const km = new KeyManager({ rotateEveryN: 2 });
    km.addKey('X'); km.addKey('Y'); km.addKey('Z');
    // rotateEveryN=2: rotate when useCount > 0 && useCount % 2 === 0
    eq(km.current(), 'X', '1st: useCount=0 → X');
    eq(km.current(), 'X', '2nd: useCount=1 → X');
    eq(km.current(), 'Y', '3rd: useCount=2, 2%2==0 → rotate → Y');
    eq(km.current(), 'Y', '4th: useCount=3 → Y');
    eq(km.current(), 'Z', '5th: useCount=4, 4%2==0 → rotate → Z');
    eq(km.current(), 'Z', '6th: useCount=5 → Z');

    // Manual rotation
    km.index = 0;
    km.rotate();
    eq(km.keys[km.index], 'Y', 'Manual rotate → Y');
    km.rotate();
    eq(km.keys[km.index], 'Z', 'Manual rotate → Z');
    km.rotate();
    eq(km.keys[km.index], 'X', 'Manual rotate wraps → X');
}

function testKeyManagerEdgeCases() {
    group('8. KeyManager — Edge Cases');
    // Single key never rotates
    const km = new KeyManager({ rotateEveryN: 2 });
    km.addKey('solo');
    km.current(); km.current(); km.current(); km.current();
    eq(km.keys[km.index], 'solo', 'Single key: no rotation');

    // Empty throws
    const km2 = new KeyManager();
    throws(() => km2.current(), 'Empty: current() throws');

    // Empty rotate is no-op
    km2.rotate(); // should not throw
    assert(true, 'Empty: rotate() does not throw');

    // onRotate callback
    let callbackArgs = null;
    const km3 = new KeyManager();
    km3.addKey('a'); km3.addKey('b');
    km3.onRotate((prev, next) => { callbackArgs = [prev, next]; });
    km3.rotate();
    deepEq(callbackArgs, [0, 1], 'onRotate callback fires with (0, 1)');
    km3.rotate();
    deepEq(callbackArgs, [1, 0], 'onRotate callback fires with (1, 0)');
}

function testSleep() {
    group('9. sleep');
    assert(sleep(0) instanceof Promise, 'Returns a Promise');
    assert(typeof sleep === 'function', 'Is a function');
    eq(sleep.length, 1, 'Takes 1 argument');
}

function testGemmaAPIConstructor() {
    group('10. GemmaAPI — Constructor');
    const api = new GemmaAPI();
    eq(api.model, 'gemma-3-27b-it', 'Default model');
    eq(api.generationConfig.temperature, 1, 'Default temperature = 1');
    eq(api.generationConfig.topP, 0.95, 'Default topP = 0.95');
    eq(api.generationConfig.topK, 40, 'Default topK = 40');
    eq(api.generationConfig.maxOutputTokens, undefined, 'No default maxOutputTokens');
    eq(api.retryOpts.maxRetries, 5, 'Default maxRetries = 5');
    assert(api.keyManager instanceof KeyManager, 'Auto-creates KeyManager');

    const km = new KeyManager({ seed: 'test' });
    const api2 = new GemmaAPI({ keyManager: km, model: 'gemma-3-4b-it', generationConfig: { temperature: 0.5 } });
    eq(api2.model, 'gemma-3-4b-it', 'Custom model');
    eq(api2.generationConfig.temperature, 0.5, 'Custom temperature');
    assert(api2.keyManager === km, 'Uses provided KeyManager');
}

async function testGemmaAPIValidation() {
    group('11. GemmaAPI — Validation');
    const api = new GemmaAPI();
    await rejects(() => api.generateContent({}), 'generateContent without contents rejects');
    await rejects(() => api.generateContent({ contents: [] }), 'generateContent with empty keys rejects');
}

function testParseToolCallsWellFormed() {
    group('12. parseToolCalls — Well-formed');
    const r1 = parseToolCalls('Hi\n<tool_call>\n{"name":"calc","arguments":{"x":1}}\n</tool_call>\nBye');
    eq(r1.length, 1, 'Single call parsed');
    eq(r1[0].name, 'calc', 'Name = calc');
    eq(r1[0].arguments.x, 1, 'Argument x = 1');

    const r2 = parseToolCalls('<tool_call>{"name":"a","arguments":{}}</tool_call>text<tool_call>{"name":"b","arguments":{"y":2}}</tool_call>');
    eq(r2.length, 2, 'Two calls parsed');
    eq(r2[0].name, 'a', 'First = a');
    eq(r2[1].name, 'b', 'Second = b');
    eq(r2[1].arguments.y, 2, 'b.y = 2');

    const r3 = parseToolCalls('<tool_call>{"name":"nested","arguments":{"obj":{"a":1,"b":[2,3]}}}</tool_call>');
    eq(r3[0].arguments.obj.a, 1, 'Nested object argument');
    deepEq(r3[0].arguments.obj.b, [2, 3], 'Nested array argument');
}

function testParseToolCallsRecovery() {
    group('13. parseToolCalls — JSON Recovery');
    // Trailing comma
    const r1 = parseToolCalls('<tool_call>{"name":"t","arguments":{"a":1,}}</tool_call>');
    eq(r1.length, 1, 'Trailing comma: recovered');
    eq(r1[0].name, 't', 'Trailing comma: name parsed');

    // Code fences inside tags
    const r2 = parseToolCalls('<tool_call>\n```json\n{"name":"fenced","arguments":{}}\n```\n</tool_call>');
    eq(r2.length, 1, 'Code fence: recovered');
    eq(r2[0].name, 'fenced', 'Code fence: name parsed');

    // Single quotes
    const r3 = parseToolCalls("<tool_call>{'name':'sq','arguments':{'k':'v'}}</tool_call>");
    eq(r3.length, 1, 'Single quotes: recovered');
    eq(r3[0].arguments.k, 'v', 'Single quotes: value parsed');

    // Unquoted keys
    const r4 = parseToolCalls('<tool_call>{name:"uq",arguments:{x:42}}</tool_call>');
    eq(r4.length, 1, 'Unquoted keys: recovered');
    eq(r4[0].name, 'uq', 'Unquoted keys: name parsed');
}

function testParseToolCallsAliases() {
    group('14. parseToolCalls — Argument Aliases');
    const r1 = parseToolCalls('<tool_call>{"name":"a","args":{"k":"v"}}</tool_call>');
    eq(r1[0].arguments.k, 'v', '"args" alias → arguments');

    const r2 = parseToolCalls('<tool_call>{"name":"b","parameters":{"p":true}}</tool_call>');
    eq(r2[0].arguments.p, true, '"parameters" alias → arguments');

    const r3 = parseToolCalls('<tool_call>{"name":"bare"}</tool_call>');
    deepEq(r3[0].arguments, {}, 'Missing arguments → empty {}');
}

function testParseToolCallsEdge() {
    group('15. parseToolCalls — Edge Cases');
    eq(parseToolCalls('no tools here').length, 0, 'No tags → empty array');
    eq(parseToolCalls('').length, 0, 'Empty string → empty array');
    eq(parseToolCalls('<tool_call>not json</tool_call>').length, 0, 'Invalid JSON → skipped');
    eq(parseToolCalls('<tool_call>{"noname": true}</tool_call>').length, 0, 'Missing name field → skipped');
    eq(parseToolCalls('<tool_call>{"name": 42}</tool_call>').length, 0, 'Non-string name → skipped');

    // Whitespace
    const r = parseToolCalls('<tool_call>   \n  {"name":"ws","arguments":{}}  \n   </tool_call>');
    eq(r.length, 1, 'Whitespace around JSON: parsed');

    // Multiple on same line
    const r2 = parseToolCalls('<tool_call>{"name":"x","arguments":{}}</tool_call><tool_call>{"name":"y","arguments":{}}</tool_call>');
    eq(r2.length, 2, 'Adjacent calls on same line: both parsed');
}

function testHasToolCalls() {
    group('16. hasToolCalls');
    assert(hasToolCalls('text <tool_call>x</tool_call> text'), 'Detects tool call in middle');
    assert(hasToolCalls('<tool_call>x</tool_call>'), 'Detects at start');

function testKeyManagerStressRotation() {

    const km = new KeyManager({ rotateEveryN: 3 });
    for (let i = 0; i < 100; i++) km.addKey('key_' + i);

    const seen = new Set();
    for (let i = 0; i < 300; i++) {
        seen.add(km.current());
    }
    assert(seen.size > 1, `Stress: used ${seen.size} different keys over 300 calls`);

    // Verify round-robin: rotateEveryN=3, rotation at useCount=3,6,9,...
    km.index = 0; km.useCount = 0;
    km.current(); // useCount 0→1, key_0
    km.current(); // useCount 1→2, key_0
    km.current(); // useCount 2→3, key_0
    const fourth = km.current(); // useCount=3, 3%3==0 → rotate → key_1
    eq(fourth, 'key_1', 'Stress: rotates to next key at boundary');
}

    try {

            description: 'Evaluate a mathematical expression and return the numeric result',
            parameters: {
                expression: { type: 'string', required: true, description: 'Math expression, e.g. "2+2"' }
            },
            handler: async (args) => {
                const expr = args.expression.replace(/[^0-9+\-*/().%\s]/g, '');
                return { result: Function('"use strict"; return (' + expr + ')')() };
            }
        });

        const runner = new ToolRunner(liveApi, registry, { maxIterations: 3 });
        let toolCallFired = false;
        let toolResultFired = false;

        const result = await runner.run('What is 15 * 23? Use the calculate tool.', {
            onToolCall: () => { toolCallFired = true; },
            onToolResult: () => { toolResultFired = true; }
        });

        assert(result.chatHistory.length >= 3, 'chatHistory populated', `${result.chatHistory.length} messages`);
        assert(result.iterations >= 1, 'At least 1 iteration', `${result.iterations} iteration(s)`);

        // Check if the model actually used the tool

            assert(true, 'Model called calculate tool', `${result.toolCalls.length} call(s)`);
            assert(toolCallFired, 'onToolCall callback fired');

            // Check result contains 345 (15*23)

        assert(typeof result.response === 'string', 'Got response', `"${result.response.slice(0, 80)}"`);
        assert(result.response.length > 0, 'Response not empty');
        eq(result.toolCalls.length, 0, 'No tools were called');
        eq(result.iterations, 1, 'Completed in 1 iteration');
    } catch (e) {
        assert(false, 'ToolRunner no-tool scenario', e.message);
    }
}

async function testLiveErrorRecovery() {
    group('L11. Live — Error Recovery (bad model name)');
    if (!liveApi) { skip('Error recovery', 'Keys not loaded'); return; }

    try {
        const history = [];
        await liveApi.chat('test', history, { model: 'non-existent-model-xyz' });
        assert(false, 'Should have thrown for bad model', 'Did not throw');
    } catch (e) {
        assert(true, 'Bad model name throws error', e.message.slice(0, 80));
        assert(e.message.includes('API error') || e.message.includes('failed'), 'Error message is descriptive');
    }
}

async function testLiveChatHistoryRollback() {
    group('L12. Live — Chat History Rollback on Error');
    if (!liveApi) { skip('History rollback', 'Keys not loaded'); return; }

    try {
        const history = [
            { role: 'user', parts: [{ text: 'Hello' }] },
            { role: 'model', parts: [{ text: 'Hi there!' }] }
        ];
        const lenBefore = history.length;

        try {
            await liveApi.chat('test', history, { model: 'non-existent-model-xyz' });
        } catch {}

        eq(history.length, lenBefore, 'History length unchanged after error (rollback worked)');
    } catch (e) {
        assert(false, 'Chat history rollback test', e.message);
    }
}

function renderResults() {
    const container = document.getElementById('testResults');
    container.innerHTML = '';

    for (const g of T.groups) {
        const gPass = g.tests.filter(t => t.status === 'pass').length;
        const gFail = g.tests.filter(t => t.status === 'fail').length;
        const show = T.filter === 'all' || g.tests.some(t => t.status === T.filter);
        if (!show) continue;

        const div = document.createElement('div');
        div.className = 'test-group';
        const allPass = gFail === 0;

        let rows = '';
        for (const t of g.tests) {
            if (T.filter !== 'all' && t.status !== T.filter) continue;
            const icon = t.status === 'pass' ? '✓' : t.status === 'fail' ? '✗' : '○';
            rows += `<div class="test-row">
                <span class="icon ${t.status}">${icon}</span>
                <span class="name">${esc(t.name)}</span>
                <span class="detail" title="${esc(t.detail)}">${esc(t.detail)}</span>
                <span class="duration">${t.duration}ms</span>
            </div>`;
        }

        div.innerHTML = `
            <div class="group-header" onclick="toggleGroup(this)">
                <span class="arrow ${allPass ? '' : 'open'}">&#9654;</span>
                <span class="title">${esc(g.title)}</span>
                <div class="group-stats">
                    <span class="mini-badge pass-bg">${gPass} ✓</span>
                    ${gFail > 0 ? `<span class="mini-badge fail-bg">${gFail} ✗</span>` : ''}
                </div>
            </div>
            <div class="group-body ${allPass ? '' : 'open'}">${rows}</div>
        `;
        container.appendChild(div);
    }
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function toggleGroup(header) {
    const arrow = header.querySelector('.arrow');
    const body = header.nextElementSibling;
    arrow.classList.toggle('open');
    body.classList.toggle('open');
}

function toggleLog() {
    const box = document.getElementById('logBox');
    box.style.display = box.style.display === 'none' ? 'block' : 'none';
}

function resetAll() {
    T.groups = []; T.total = 0; T.passed = 0; T.failed = 0; T.skipped = 0;
    document.getElementById('testResults').innerHTML = '';
    document.getElementById('logBox').textContent = '';
    document.getElementById('progressBar').style.width = '0%';
    document.getElementById('progressText').textContent = '';
    ['sTotal','sPass','sFail','sSkip'].forEach(id => document.getElementById(id).textContent = '0');
    document.getElementById('sDur').textContent = '—';
    ['fAll','fPass','fFail','fSkip'].forEach(id => document.getElementById(id).textContent = '');
}

// Filter tabs
document.getElementById('filterTabs').addEventListener('click', function(e) {
    const tab = e.target.closest('.filter-tab');
    if (!tab) return;
    document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    T.filter = tab.dataset.filter;
    renderResults();
});

// Auto-run on load
window.addEventListener('load', () => setTimeout(runAllTests, 100));
