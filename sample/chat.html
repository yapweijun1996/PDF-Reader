<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gemini Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <script src="./gemma.js"></script>
    <style>
        /* ── Reset & Base ── */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #0d0d0f;
            --surface: #1a1a1e;
            --surface2: #242428;
            --border: rgba(255, 255, 255, 0.08);
            --accent: #2997ff;
            --accent-glow: rgba(41, 151, 255, 0.25);
            --text: #f0f0f2;
            --text-muted: #8e8e95;
            --user-bubble: rgba(41, 151, 255, 0.18);
            --model-bubble: #1e1e24;
            --radius: 18px;
            --input-h: 56px;
            --sidebar-w: 260px;
        }

        html,
        body {
            height: 100%;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
        }

        /* ── Layout ── */
        .app {
            display: flex;
            height: 100vh;
        }

        /* ── Sidebar ── */
        .sidebar {
            width: var(--sidebar-w);
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 20px 14px;
            gap: 8px;
            flex-shrink: 0;
        }

        .sidebar-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 4px 8px 16px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 4px;
        }

        .sidebar-logo .logo-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #2997ff, #6e5cf6);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .sidebar-logo span {
            font-weight: 600;
            font-size: 15px;
            letter-spacing: -0.3px;
        }

        .new-chat-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 9px 12px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            cursor: pointer;
            font-size: 13.5px;
            font-family: inherit;
            transition: background 0.15s, border-color 0.15s;
        }

        .new-chat-btn:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(255, 255, 255, 0.14);
        }

        .new-chat-btn svg {
            opacity: 0.7;
        }

        .sidebar-section-label {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.6px;
            padding: 6px 8px 2px;
        }

        .chat-history-item {
            padding: 8px 12px;
            border-radius: 9px;
            cursor: pointer;
            font-size: 13px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: background 0.12s, color 0.12s;
        }

        .chat-history-item:hover,
        .chat-history-item.active {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text);
        }

        .sidebar-bottom {
            margin-top: auto;
            border-top: 1px solid var(--border);
            padding-top: 12px;
        }

        .model-selector {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.12s;
        }

        .model-selector:hover {
            background: rgba(255, 255, 255, 0.06);
        }

        .model-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #30d158;
            box-shadow: 0 0 6px #30d158;
            flex-shrink: 0;
        }

        .model-name {
            font-size: 13px;
            font-weight: 500;
            color: var(--text);
        }

        .model-tag {
            font-size: 10px;
            color: var(--text-muted);
            margin-left: auto;
            background: rgba(255, 255, 255, 0.07);
            padding: 2px 6px;
            border-radius: 4px;
        }

        /* ── Main Chat Area ── */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        /* Topbar */
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 24px;
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            background: rgba(13, 13, 15, 0.7);
            flex-shrink: 0;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .topbar-title {
            font-size: 15px;
            font-weight: 500;
            color: var(--text);
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .icon-btn {
            width: 34px;
            height: 34px;
            border-radius: 8px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.12s, color 0.12s;
        }

        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.07);
            color: var(--text);
        }

        /* Messages */
        .messages-wrap {
            flex: 1;
            overflow-y: auto;
            padding: 28px 0;
            scroll-behavior: smooth;
        }

        .messages-wrap::-webkit-scrollbar {
            width: 4px;
        }

        .messages-wrap::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
        }

        .messages-inner {
            max-width: 720px;
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        /* Empty state */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            gap: 16px;
            text-align: center;
            padding: 40px;
        }

        .empty-icon {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #2997ff, #6e5cf6);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 0 40px var(--accent-glow);
        }

        .empty-title {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.4px;
        }

        .empty-subtitle {
            font-size: 14px;
            color: var(--text-muted);
            max-width: 320px;
            line-height: 1.6;
        }

        .suggestion-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-top: 8px;
        }

        .chip {
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: var(--surface2);
            color: var(--text-muted);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.15s;
            font-family: inherit;
        }

        .chip:hover {
            border-color: var(--accent);
            color: var(--text);
            background: rgba(41, 151, 255, 0.08);
        }

        /* Message bubbles */
        .msg-row {
            display: flex;
            gap: 12px;
            max-width: 100%;
            animation: fadeUp 0.22s ease both;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .msg-row.user {
            flex-direction: row-reverse;
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600;
            margin-top: 2px;
        }

        .avatar.user-av {
            background: linear-gradient(135deg, #2997ff, #6e5cf6);
            color: #fff;
            font-size: 12px;
        }

        .avatar.model-av {
            background: linear-gradient(135deg, #1e1e28, #30303c);
            border: 1px solid var(--border);
            font-size: 16px;
        }

        .bubble {
            max-width: calc(100% - 60px);
            padding: 12px 16px;
            border-radius: var(--radius);
            font-size: 14.5px;
            line-height: 1.65;
            word-break: break-word;
            position: relative;
        }

        .msg-row.user .bubble {
            background: var(--user-bubble);
            border: 1px solid rgba(41, 151, 255, 0.25);
            border-top-right-radius: 6px;
            color: var(--text);
        }

        .msg-row.model .bubble {
            background: var(--model-bubble);
            border: 1px solid var(--border);
            border-top-left-radius: 6px;
        }

        .msg-row.system .bubble {
            background: rgba(255, 214, 10, 0.08);
            border: 1px solid rgba(255, 214, 10, 0.2);
            color: #ffd60a;
            font-size: 13px;
            border-radius: 10px;
            align-self: center;
            max-width: 100%;
        }

        .msg-row.system {
            justify-content: center;
        }

        /* Markdown inside bubble */
        .bubble pre {
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 10px;
            padding: 12px 14px;
            overflow-x: auto;
            margin: 8px 0;
            font-size: 13px;
        }

        .bubble code {
            font-family: 'SF Mono', Menlo, Monaco, Consolas, monospace;
            font-size: 13px;
        }

        .bubble :not(pre)>code {
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 5px;
            border-radius: 4px;
        }

        .bubble p {
            margin: 0 0 6px;
        }

        .bubble p:last-child {
            margin-bottom: 0;
        }

        .bubble ul,
        .bubble ol {
            padding-left: 20px;
            margin: 6px 0;
        }

        .bubble li {
            margin: 3px 0;
        }

        .bubble h1,
        .bubble h2,
        .bubble h3 {
            margin: 10px 0 4px;
            font-weight: 600;
        }

        .bubble h1 {
            font-size: 16px;
        }

        .bubble h2 {
            font-size: 15px;
        }

        .bubble h3 {
            font-size: 14px;
        }

        .bubble strong {
            font-weight: 600;
        }

        .bubble em {
            font-style: italic;
        }

        .bubble a {
            color: var(--accent);
            text-decoration: none;
        }

        .bubble a:hover {
            text-decoration: underline;
        }

        .bubble hr {
            border: none;
            border-top: 1px solid var(--border);
            margin: 10px 0;
        }

        .bubble blockquote {
            border-left: 3px solid var(--accent);
            padding-left: 10px;
            color: var(--text-muted);
            margin: 6px 0;
        }

        /* Image attachment in bubble */
        .bubble img.attached {
            max-width: 260px;
            border-radius: 10px;
            display: block;
            margin: 6px 0;
            cursor: pointer;
            border: 1px solid var(--border);
            transition: opacity 0.15s;
        }

        .bubble img.attached:hover {
            opacity: 0.85;
        }

        /* Typing indicator */
        .typing-dots {
            display: flex;
            gap: 4px;
            align-items: center;
            padding: 4px 0;
        }

        .typing-dots span {
            width: 7px;
            height: 7px;
            background: var(--text-muted);
            border-radius: 50%;
            animation: bounce 1.1s ease infinite;
        }

        .typing-dots span:nth-child(2) {
            animation-delay: 0.18s;
        }

        .typing-dots span:nth-child(3) {
            animation-delay: 0.36s;
        }

        @keyframes bounce {

            0%,
            60%,
            100% {
                transform: translateY(0);
                opacity: 0.5;
            }

            30% {
                transform: translateY(-6px);
                opacity: 1;
            }
        }

        /* ── Input Area ── */
        .input-area {
            padding: 14px 24px 18px;
            background: rgba(13, 13, 15, 0.8);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-top: 1px solid var(--border);
            flex-shrink: 0;
        }

        .input-inner {
            max-width: 720px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* Attachment preview */
        .attach-preview {
            display: none;
            align-items: center;
            gap: 8px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 8px 12px;
        }

        .attach-preview.visible {
            display: flex;
        }

        .attach-thumb {
            width: 40px;
            height: 40px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid var(--border);
        }

        .attach-info {
            flex: 1;
            min-width: 0;
        }

        .attach-name {
            font-size: 12px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .attach-size {
            font-size: 11px;
            color: var(--text-muted);
        }

        .attach-remove {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 18px;
            line-height: 1;
            padding: 2px 6px;
            border-radius: 6px;
            transition: background 0.12s, color 0.12s;
        }

        .attach-remove:hover {
            background: rgba(255, 69, 58, 0.15);
            color: #ff453a;
        }

        /* Text input row */
        .input-row {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 8px 8px 8px 14px;
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        .input-row:focus-within {
            border-color: rgba(41, 151, 255, 0.5);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        #chatInput {
            flex: 1;
            background: none;
            border: none;
            outline: none;
            color: var(--text);
            font-family: inherit;
            font-size: 14.5px;
            line-height: 1.5;
            resize: none;
            max-height: 160px;
            min-height: 24px;
            padding: 2px 0;
        }

        #chatInput::placeholder {
            color: var(--text-muted);
        }

        #chatInput::-webkit-scrollbar {
            width: 3px;
        }

        #chatInput::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
        }

        .input-actions {
            display: flex;
            align-items: flex-end;
            gap: 4px;
        }

        .action-btn {
            width: 34px;
            height: 34px;
            border-radius: 9px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.12s, color 0.12s;
            flex-shrink: 0;
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.07);
            color: var(--text);
        }

        #sendBtn {
            width: 34px;
            height: 34px;
            border-radius: 9px;
            border: none;
            background: var(--accent);
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s, transform 0.1s, opacity 0.15s;
            flex-shrink: 0;
        }

        #sendBtn:hover:not(:disabled) {
            background: #1a84e5;
        }

        #sendBtn:active:not(:disabled) {
            transform: scale(0.93);
        }

        #sendBtn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .input-foot {
            text-align: center;
            font-size: 11px;
            color: var(--text-muted);
        }

        /* ── Image Modal ── */
        #imgModal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }

        #imgModal.open {
            opacity: 1;
            pointer-events: all;
        }

        #imgModal img {
            max-width: 88vw;
            max-height: 88vh;
            border-radius: 12px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
        }

        #imgModalClose {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.12s;
        }

        #imgModalClose:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        /* ── Responsive ── */
        @media (max-width: 640px) {
            .sidebar {
                display: none;
            }

            .topbar {
                padding: 12px 16px;
            }

            .messages-inner {
                padding: 0 12px;
            }

            .input-area {
                padding: 10px 12px 14px;
            }
        }
    </style>
</head>

<body>

    <div class="app">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-logo">
                <div class="logo-icon">✦</div>
                <span>Gemini Chat</span>
            </div>

            <button class="new-chat-btn" id="newChatBtn">
                <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                    <path d="M7 1v12M1 7h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
                </svg>
                New chat
            </button>

            <div class="sidebar-section-label">Recent</div>
            <div id="historyList"></div>

            <div class="sidebar-bottom">
                <div class="model-selector">
                    <div class="model-dot"></div>
                    <span class="model-name" id="sidebarModelName">gemma-3-27b-it</span>
                    <span class="model-tag">Online</span>
                </div>
            </div>
        </aside>

        <!-- Main -->
        <div class="main">
            <!-- Topbar -->
            <header class="topbar">
                <span class="topbar-title" id="topbarTitle">Gemini Chat</span>
                <div class="topbar-right">
                    <select id="modelSelect" style="
          background:var(--surface2); border:1px solid var(--border);
          color:var(--text); padding:5px 10px; border-radius:8px;
          font-family:inherit; font-size:12.5px; cursor:pointer; outline:none;">
                        <option value="gemma-3-27b-it">gemma-3-27b-it</option>
                    </select>
                    <button class="icon-btn" id="clearBtn" title="Clear conversation">
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                            <path
                                d="M2 4h12M5 4V2.5a.5.5 0 0 1 .5-.5h5a.5.5 0 0 1 .5.5V4m2 0v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V4h10z"
                                stroke="currentColor" stroke-width="1.3" stroke-linecap="round"
                                stroke-linejoin="round" />
                        </svg>
                    </button>
                </div>
            </header>

            <!-- Messages -->
            <div class="messages-wrap" id="messagesWrap">
                <div class="messages-inner" id="messagesInner">
                    <!-- Empty state -->
                    <div class="empty-state" id="emptyState">
                        <div class="empty-icon">✦</div>
                        <div class="empty-title">How can I help you?</div>
                        <div class="empty-subtitle">Ask anything — or upload an image for OCR. Powered by Gemini.</div>
                        <div class="suggestion-chips">
                            <button class="chip" data-prompt="Explain quantum computing in simple terms">Explain quantum
                                computing</button>
                            <button class="chip" data-prompt="Write a Python function to parse JSON">Write Python
                                code</button>
                            <button class="chip" data-prompt="What are the best practices for REST API design?">REST API
                                best practices</button>
                            <button class="chip" data-prompt="Summarize the key differences between React and Vue">React
                                vs Vue</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Input area -->
            <div class="input-area">
                <div class="input-inner">
                    <!-- Attachment preview -->
                    <div class="attach-preview" id="attachPreview">
                        <img class="attach-thumb" id="attachThumb" src="" alt="" />
                        <div class="attach-info">
                            <div class="attach-name" id="attachName">image.png</div>
                            <div class="attach-size" id="attachSize">—</div>
                        </div>
                        <button class="attach-remove" id="removeAttach" title="Remove">×</button>
                    </div>

                    <!-- Text input row -->
                    <div class="input-row">
                        <textarea id="chatInput" rows="1" placeholder="Message Gemini…"></textarea>
                        <div class="input-actions">
                            <!-- File attach -->
                            <button class="action-btn" id="attachBtn" title="Attach image">
                                <svg width="17" height="17" viewBox="0 0 17 17" fill="none">
                                    <path
                                        d="M14.5 8.5l-6.3 6.3a4.24 4.24 0 0 1-6-6L8.5 2.5a2.83 2.83 0 0 1 4 4L6.2 12.8a1.41 1.41 0 0 1-2-2L10 5"
                                        stroke="currentColor" stroke-width="1.4" stroke-linecap="round"
                                        stroke-linejoin="round" />
                                </svg>
                            </button>
                            <input type="file" id="fileInput" accept="image/*" style="display:none" />
                            <!-- Send -->
                            <button id="sendBtn" disabled title="Send">
                                <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                                    <path d="M8 13V3M3 8l5-5 5 5" stroke="currentColor" stroke-width="1.8"
                                        stroke-linecap="round" stroke-linejoin="round" />
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="input-foot">Gemini may make mistakes. Verify important info.</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Image modal -->
    <div id="imgModal">
        <button id="imgModalClose">✕</button>
        <img id="imgModalImg" src="" alt="preview" />
    </div>

    <!-- Hidden file input for clipboard paste -->
    <input type="file" id="pasteFileInput" accept="image/*" style="display:none" />

    <script>
        // ============================================================
        //  Minimal markdown → HTML renderer
        // ============================================================
        function renderMarkdown(text) {
            // Escape HTML first (basic)
            let s = text
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');

            // Fenced code blocks
            s = s.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) =>
                `<pre><code class="lang-${lang}">${code.trim()}</code></pre>`
            );

            // Inline code
            s = s.replace(/`([^`\n]+)`/g, '<code>$1</code>');

            // Bold / italic
            s = s.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
            s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            s = s.replace(/\*(.+?)\*/g, '<em>$1</em>');

            // Headings
            s = s.replace(/^### (.+)$/gm, '<h3>$1</h3>');
            s = s.replace(/^## (.+)$/gm, '<h2>$1</h2>');
            s = s.replace(/^# (.+)$/gm, '<h1>$1</h1>');

            // Blockquote
            s = s.replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>');

            // HR
            s = s.replace(/^---$/gm, '<hr>');

            // Unordered list
            s = s.replace(/((?:^[-*] .+\n?)+)/gm, match => {
                const items = match.trim().split('\n').map(l => `<li>${l.replace(/^[-*] /, '')}</li>`).join('');
                return `<ul>${items}</ul>`;
            });

            // Ordered list
            s = s.replace(/((?:^\d+\. .+\n?)+)/gm, match => {
                const items = match.trim().split('\n').map(l => `<li>${l.replace(/^\d+\. /, '')}</li>`).join('');
                return `<ol>${items}</ol>`;
            });

            // Links
            s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');

            // Paragraphs (blank-line separated, skip block elements)
            s = s.split(/\n{2,}/).map(block => {
                if (/^<(h[1-6]|ul|ol|pre|hr|blockquote)/.test(block)) return block;
                return `<p>${block.replace(/\n/g, '<br>')}</p>`;
            }).join('\n');

            return s;
        }

        // ============================================================
        //  State
        // ============================================================
        const generationConfig = {
            temperature: 1,
            topP: 0.95,
            topK: 40,
            maxOutputTokens: 8192,
            responseMimeType: "text/plain"
        };

        let chatHistory = [];
        let attachedFile = null;    // current pending attachment
        let sessions = [];      // [{title, history}]
        let currentSession = null;
        let isSending = false;

        // ============================================================
        //  DOM refs
        // ============================================================
        const $ = id => document.getElementById(id);
        const messagesInner = $('messagesInner');
        const messagesWrap = $('messagesWrap');
        const chatInput = $('chatInput');
        const sendBtn = $('sendBtn');
        const emptyState = $('emptyState');
        const attachPreview = $('attachPreview');
        const attachThumb = $('attachThumb');
        const attachName_el = $('attachName');
        const attachSize_el = $('attachSize');
        const fileInput = $('fileInput');
        const historyList = $('historyList');

        // ============================================================
        //  Helpers
        // ============================================================
        function scrollToBottom() {
            messagesWrap.scrollTo({ top: messagesWrap.scrollHeight, behavior: 'smooth' });
        }

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }

        function hideEmpty() {
            if (emptyState) {
                emptyState.style.display = 'none';
            }
        }

        function showEmpty() {
            if (emptyState) {
                emptyState.style.display = '';
            }
        }

        // ============================================================
        //  Message rendering
        // ============================================================
        function appendMessage(role, content, imageFile = null) {
            hideEmpty();

            const row = document.createElement('div');
            row.className = `msg-row ${role}`;

            if (role === 'system') {
                const bubble = document.createElement('div');
                bubble.className = 'bubble';
                bubble.textContent = content;
                row.appendChild(bubble);
                messagesInner.appendChild(row);
                scrollToBottom();
                return row;
            }

            // Avatar
            const av = document.createElement('div');
            av.className = `avatar ${role === 'user' ? 'user-av' : 'model-av'}`;
            av.textContent = role === 'user' ? 'You' : '✦';
            row.appendChild(av);

            const bubble = document.createElement('div');
            bubble.className = 'bubble';

            if (imageFile) {
                const img = document.createElement('img');
                img.className = 'attached';
                img.src = URL.createObjectURL(imageFile);
                img.alt = imageFile.name || 'image';
                img.onclick = () => openImgModal(img.src);
                bubble.appendChild(img);
            }

            if (content) {
                if (role === 'model') {
                    bubble.innerHTML += renderMarkdown(content);
                } else {
                    const p = document.createElement('p');
                    p.style.whiteSpace = 'pre-wrap';
                    p.textContent = content;
                    bubble.appendChild(p);
                }
            }

            row.appendChild(bubble);
            messagesInner.appendChild(row);
            scrollToBottom();
            return row;
        }

        function appendTypingIndicator() {
            const row = document.createElement('div');
            row.className = 'msg-row model';
            row.id = 'typingRow';

            const av = document.createElement('div');
            av.className = 'avatar model-av';
            av.textContent = '✦';
            row.appendChild(av);

            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.innerHTML = `<div class="typing-dots"><span></span><span></span><span></span></div>`;
            row.appendChild(bubble);

            messagesInner.appendChild(row);
            scrollToBottom();
            return row;
        }

        function removeTypingIndicator() {
            const el = $('typingRow');
            if (el) el.remove();
        }

        // ============================================================
        //  Attachment handling
        // ============================================================
        function setAttachedFile(file) {
            if (!file || !file.type.startsWith('image/')) return;
            attachedFile = file;
            attachPreview.classList.add('visible');
            attachThumb.src = URL.createObjectURL(file);
            attachName_el.textContent = file.name || 'image';
            attachSize_el.textContent = formatSize(file.size);
            updateSendBtn();
        }

        function clearAttachedFile() {
            attachedFile = null;
            attachPreview.classList.remove('visible');
            attachThumb.src = '';
            fileInput.value = '';
            updateSendBtn();
        }

        $('removeAttach').addEventListener('click', clearAttachedFile);

        fileInput.addEventListener('change', e => {
            const f = e.target.files[0];
            if (f) setAttachedFile(f);
        });

        $('attachBtn').addEventListener('click', () => fileInput.click());

        // ============================================================
        //  Textarea auto-resize + send button state
        // ============================================================
        function updateSendBtn() {
            const hasText = chatInput.value.trim().length > 0;
            const hasImg = !!attachedFile;
            sendBtn.disabled = (!hasText && !hasImg) || isSending;
        }

        chatInput.addEventListener('input', () => {
            chatInput.style.height = 'auto';
            chatInput.style.height = Math.min(chatInput.scrollHeight, 160) + 'px';
            updateSendBtn();
        });

        chatInput.addEventListener('keydown', e => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                if (!sendBtn.disabled) handleSend();
            }
        });

        // ============================================================
        //  Session / history sidebar
        // ============================================================
        function saveSession() {
            if (chatHistory.length === 0) return;
            const title = getSessionTitle();
            if (currentSession !== null) {
                sessions[currentSession].history = [...chatHistory];
                sessions[currentSession].title = title;
            } else {
                sessions.unshift({ title, history: [...chatHistory] });
                currentSession = 0;
            }
            renderHistoryList();
        }

        function getSessionTitle() {
            const firstUser = chatHistory.find(m => m.role === 'user');
            if (!firstUser) return 'New chat';
            const text = firstUser.parts.find(p => p.text)?.text || 'New chat';
            return text.slice(0, 38) + (text.length > 38 ? '…' : '');
        }

        function renderHistoryList() {
            historyList.innerHTML = '';
            sessions.forEach((s, i) => {
                const item = document.createElement('div');
                item.className = 'chat-history-item' + (i === currentSession ? ' active' : '');
                item.textContent = s.title;
                item.onclick = () => loadSession(i);
                historyList.appendChild(item);
            });
        }

        function loadSession(index) {
            currentSession = index;
            chatHistory = [...sessions[index].history];
            messagesInner.innerHTML = '';
            chatHistory.forEach(m => {
                const text = m.parts.find(p => p.text)?.text || '';
                appendMessage(m.role === 'user' ? 'user' : 'model', text);
            });
            renderHistoryList();
        }

        // ============================================================
        //  Suggestion chips
        // ============================================================
        document.querySelectorAll('.chip').forEach(chip => {
            chip.addEventListener('click', () => {
                chatInput.value = chip.dataset.prompt;
                chatInput.dispatchEvent(new Event('input'));
                chatInput.focus();
            });
        });

        // ============================================================
        //  New chat / clear
        // ============================================================
        function startNewChat() {
            if (chatHistory.length > 0) saveSession();
            chatHistory = [];
            currentSession = null;
            messagesInner.innerHTML = '';
            messagesInner.appendChild(emptyState);
            showEmpty();
            clearAttachedFile();
            chatInput.value = '';
            chatInput.style.height = 'auto';
            updateSendBtn();
            renderHistoryList();
            $('topbarTitle').textContent = 'Gemini Chat';
        }

        $('newChatBtn').addEventListener('click', startNewChat);
        $('clearBtn').addEventListener('click', startNewChat);

        // ============================================================
        //  Send message
        // ============================================================
        async function handleSend() {
            const text = chatInput.value.trim();
            const imgFile = attachedFile;

            if (!text && !imgFile) return;
            if (isSending) return;

            isSending = true;
            updateSendBtn();

            // Render user message
            appendMessage('user', text, imgFile);

            // Build API parts
            const parts = [];
            if (text) parts.push({ text });

            if (imgFile) {
                try {
                    const b64 = await readFileAsBase64(imgFile);
                    parts.push({ inline_data: { data: b64, mime_type: imgFile.type } });
                    if (!text) parts.unshift({ text: "Extract text from the given image. The output text format must follow the same as the given image." });
                } catch {
                    appendMessage('system', 'Failed to read image file.');
                    isSending = false;
                    updateSendBtn();
                    return;
                }
            }

            const userMsg = { role: 'user', parts };

            // Reset input
            chatInput.value = '';
            chatInput.style.height = 'auto';
            clearAttachedFile();
            updateSendBtn();

            // Update topbar title on first user message
            if (chatHistory.length === 0) {
                $('topbarTitle').textContent = (text || 'Image OCR').slice(0, 40);
            }

            // Show typing
            appendTypingIndicator();

            try {
                const model = $('modelSelect').value;
                const result = await callGeminiAPI(model, userMsg, chatHistory, generationConfig);
                removeTypingIndicator();

                const responseText = result.candidates[0].content.parts
                    .filter(p => p.text).map(p => p.text).join('\n');

                appendMessage('model', responseText || '(No text response)');
                saveSession();
            } catch (err) {
                removeTypingIndicator();
                appendMessage('system', 'Error: ' + err.message);
            }

            isSending = false;
            updateSendBtn();
            chatInput.focus();
        }

        sendBtn.addEventListener('click', handleSend);

        // ============================================================
        //  Read file as base64
        // ============================================================
        function readFileAsBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        // ============================================================
        //  Clipboard paste (image)
        // ============================================================
        document.addEventListener('paste', e => {
            const items = e.clipboardData?.items;
            if (!items) return;
            for (const item of items) {
                if (item.kind === 'file' && item.type.startsWith('image/')) {
                    const blob = item.getAsFile();
                    setAttachedFile(blob);
                    break;
                }
            }
        });

        // ============================================================
        //  Image modal
        // ============================================================
        function openImgModal(src) {
            $('imgModalImg').src = src;
            $('imgModal').classList.add('open');
        }

        $('imgModalClose').addEventListener('click', () => {
            $('imgModal').classList.remove('open');
            $('imgModalImg').src = '';
        });
        $('imgModal').addEventListener('click', e => {
            if (e.target === $('imgModal')) {
                $('imgModal').classList.remove('open');
                $('imgModalImg').src = '';
            }
        });

        // ============================================================
        //  Model selector → sidebar label sync
        // ============================================================
        $('modelSelect').addEventListener('change', () => {
            $('sidebarModelName').textContent = $('modelSelect').value;
        });

        // ============================================================
        //  Init
        // ============================================================
        loadApiKeys().then(() => {
            console.log('[Chat] API keys loaded, ready.');
            updateSendBtn();
        }).catch(err => {
            appendMessage('system', 'Failed to load API keys: ' + err.message);
        });
    </script>
</body>

</html>
