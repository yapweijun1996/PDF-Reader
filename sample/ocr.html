<html>

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>OCR with Google Gemini API</title>
	<style>
		body {
			font-family: Arial, sans-serif;
			margin: 20px;
		}

		#container {
			max-width: 600px;
			margin: 0 auto;
		}

		#uploadSection {
			margin-bottom: 20px;
		}

		select {
			margin-left: 10px;
		}

		.message {
			padding: 8px;
			margin-bottom: 10px;
			border-radius: 4px;
			white-space: break-spaces;
		}

		.user {
			background: #f0f0f0;
		}

		.system {
			background: #fff3cd;
		}

		.model {
			background: #d4edda;
		}

		#chatMessages {
			border: 1px solid #ddd;
			padding: 10px;
			max-height: 95vh;
			min-height: 10vh;
			overflow-y: auto;
		}

		#downloadContainer a {
			display: block;
			margin-top: 5px;
		}

		/* Image thumbnail in chat */
		.chatImage {
			max-width: 200px;
			cursor: pointer;
			border: 1px solid #ccc;
			border-radius: 4px;
		}

		/* Modal preview */
		#previewModal {
			position: fixed;
			inset: 0;
			background: rgba(0, 0, 0, 0.5);
			display: none;
			justify-content: center;
			align-items: center;
			z-index: 1000;
		}

		#previewModal.show {
			display: flex;
		}

		#previewModalContent {
			background: #fff;
			padding: 20px;
			border-radius: 8px;
			position: relative;
			max-width: 90%;
			max-height: 90%;
			overflow: auto;
		}

		#previewModalContent img {
			max-width: 100%;
			height: auto;
		}

		.closeBtn {
			position: absolute;
			top: 10px;
			right: 10px;
			background: #f00;
			color: #fff;
			border: none;
			font-size: 14px;
			padding: 3px 6px;
			cursor: pointer;
		}
	</style>
	<script src="./gemma.js"></script>
</head>

<body>
	<div id="container">
		<h1>OCR with Google Gemini API</h1>
		<div id="uploadSection">
			<input type="file" id="imageInput" accept="image/*" />
			<select id="modelSelect">
				<option value="gemma-3-27b-it" selected>gemma-3-27b-it</option>
			</select>
			<button id="sendBtn">Perform OCR</button>
		</div>
		<div id="chatMessages"></div>
		<div id="downloadContainer"></div>
	</div>

	<!-- Modal Dialog for Image Preview -->
	<div id="previewModal">
		<div id="previewModalContent">
			<button class="closeBtn" onclick="closePreviewModal()">X</button>
			<img id="previewImage" src="" alt="Preview" />
		</div>
	</div>

	<script>
		const generationConfig = {
			temperature: 1,
			topP: 0.95,
			topK: 40,
			maxOutputTokens: 8192,
			responseMimeType: "text/plain"
		};

		const DEFAULT_MODEL = "gemma-3-27b-it";
		let chatHistory = [];

		// --- DOM helpers ---

		const $ = id => document.getElementById(id);

		function appendMessage(role, text) {
			const div = document.createElement("div");
			div.className = "message " + role;
			div.textContent = text;
			$("chatMessages").appendChild(div);
			$("chatMessages").scrollTop = $("chatMessages").scrollHeight;
		}

		function appendImageMessage(file) {
			const container = document.createElement("div");
			container.className = "message user";

			const img = document.createElement("img");
			img.className = "chatImage";
			img.src = URL.createObjectURL(file);
			img.alt = file.name || "pasted image";
			img.onclick = () => showPreview(file);

			container.appendChild(img);
			$("chatMessages").appendChild(container);
			$("chatMessages").scrollTop = $("chatMessages").scrollHeight;
		}

		// --- Modal ---

		function showPreview(file) {
			$("previewImage").src = URL.createObjectURL(file);
			$("previewModal").classList.add("show");
		}

		function closePreviewModal() {
			$("previewModal").classList.remove("show");
			$("previewImage").src = "";
		}

		// --- Utilities ---

		function readFileAsBase64(file) {
			return new Promise((resolve, reject) => {
				const reader = new FileReader();
				reader.onload = () => resolve(reader.result.split(",")[1]);
				reader.onerror = reject;
				reader.readAsDataURL(file);
			});
		}

		function processInlineData(result) {
			const container = $("downloadContainer");
			container.innerHTML = "";
			(result.candidates || []).forEach((cand, i) => {
				(cand.content.parts || []).forEach((part, j) => {
					if (!part.inline_data) return;
					const bytes = atob(part.inline_data.data);
					const blob = new Blob(
						[new Uint8Array([...bytes].map(c => c.charCodeAt(0)))],
						{ type: part.inline_data.mime_type }
					);
					const ext = part.inline_data.mime_type.split("/")[1] || "bin";
					const link = document.createElement("a");
					link.href = URL.createObjectURL(blob);
					link.download = `output_${i}_${j}.${ext}`;
					link.textContent = "Download " + link.download;
					container.appendChild(link);
				});
			});
		}

		// --- OCR ---

		async function runOCR() {
			const imageFile = $("imageInput").files[0];
			if (!imageFile) { alert("Please upload or paste an image."); return; }

			appendMessage("user", "Uploaded image: " + (imageFile.name || "pasted-image.png"));
			appendMessage("system", "Processing image for OCR...");

			let base64Data;
			try {
				base64Data = await readFileAsBase64(imageFile);
			} catch {
				appendMessage("system", "Error reading image.");
				return;
			}

			const userMessage = {
				role: "user",
				parts: [
					{ text: "Extract text from the given image. The output text format must follow the same as the given image." },
					{ inline_data: { data: base64Data, mime_type: imageFile.type } }
				]
			};

			try {
				const result = await callGeminiAPI($("modelSelect").value, userMessage, chatHistory, generationConfig);
				// Remove the "Processing..." status message
				const chat = $("chatMessages");
				chat.removeChild(chat.lastChild);

				const textResponse = result.candidates[0].content.parts
					.filter(p => p.text).map(p => p.text).join("\n");
				appendMessage("model", textResponse || "No text response.");
				processInlineData(result);
			} catch (err) {
				appendMessage("system", "Error: " + err.message);
			}
		}

		// --- Event listeners ---

		$("modelSelect").value = DEFAULT_MODEL;

		// Load API keys first, then bind events
		loadApiKeys().then(() => {
			$("imageInput").addEventListener("change", e => {
				if (e.target.files[0]) appendImageMessage(e.target.files[0]);
			});

			$("sendBtn").addEventListener("click", runOCR);
		}).catch(err => {
			appendMessage("system", "Failed to load API keys: " + err.message);
		});

		document.addEventListener("paste", e => {
			const items = e.clipboardData?.items;
			if (!items) return;
			for (const item of items) {
				if (item.kind === "file" && item.type.startsWith("image/")) {
					const blob = item.getAsFile();
					const dt = new DataTransfer();
					dt.items.add(blob);
					$("imageInput").files = dt.files;
					appendImageMessage(blob);
					runOCR();
					break;
				}
			}
		});
	</script>
</body>

</html>
