<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background (works for maskable too) -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Back page (English / source) — light cream -->
  <g transform="translate(96 112) rotate(-6 90 130)">
    <rect width="180" height="240" rx="16" fill="#f5f5f0"/>
    <rect x="22" y="38" width="100" height="12" rx="3" fill="#1f2937"/>
    <rect x="22" y="64" width="140" height="7" rx="2" fill="#9ca3af"/>
    <rect x="22" y="80" width="120" height="7" rx="2" fill="#9ca3af"/>
    <rect x="22" y="96" width="135" height="7" rx="2" fill="#9ca3af"/>
    <rect x="22" y="112" width="80" height="7" rx="2" fill="#9ca3af"/>
    <rect x="22" y="138" width="115" height="7" rx="2" fill="#9ca3af"/>
    <rect x="22" y="154" width="140" height="7" rx="2" fill="#9ca3af"/>
    <rect x="22" y="170" width="95" height="7" rx="2" fill="#9ca3af"/>
  </g>

  <!-- Front page (translated / accent blue) -->
  <g transform="translate(232 152) rotate(6 90 130)">
    <rect width="180" height="240" rx="16" fill="url(#accent)"/>
    <!-- Stylized CJK strokes suggesting Chinese characters -->
    <rect x="28" y="40"  width="68"  height="12" rx="3" fill="#0b1220"/>
    <rect x="28" y="60"  width="124" height="7"  rx="2" fill="rgba(11,18,32,0.7)"/>
    <rect x="28" y="76"  width="100" height="7"  rx="2" fill="rgba(11,18,32,0.7)"/>
    <rect x="28" y="92"  width="118" height="7"  rx="2" fill="rgba(11,18,32,0.7)"/>
    <rect x="28" y="108" width="86"  height="7"  rx="2" fill="rgba(11,18,32,0.7)"/>
    <rect x="28" y="134" width="124" height="7"  rx="2" fill="rgba(11,18,32,0.7)"/>
    <rect x="28" y="150" width="100" height="7"  rx="2" fill="rgba(11,18,32,0.7)"/>
    <rect x="28" y="166" width="120" height="7"  rx="2" fill="rgba(11,18,32,0.7)"/>
  </g>

  <!-- Translation arrow badge over the seam -->
  <g transform="translate(256 256)">
    <circle r="48" fill="#0b1220" stroke="url(#accent)" stroke-width="6"/>
    <path d="M -22 0 L 22 0 M 12 -10 L 22 0 L 12 10" stroke="url(#accent)" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
